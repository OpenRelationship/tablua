# The look: Blitz (html5ever, Stylo, Taffy, Parley) built to WebAssembly (wasm32-wasip1), no painting, shell or
# network. Built by CI only (AGENTS.md); the module is a release asset, pinned by SHA-384 where it is used.
[package]
name = "moonflower-look"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "look"
path = "src/main.rs"

[dependencies]
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "d2827fb386fd22668b7b8bed42639d8e75ddca71", default-features = false }
blitz-html = { git = "https://github.com/DioxusLabs/blitz", rev = "d2827fb386fd22668b7b8bed42639d8e75ddca71", default-features = false }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "d2827fb386fd22668b7b8bed42639d8e75ddca71", default-features = false }
style = { version = "0.22.0", package = "stylo" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
